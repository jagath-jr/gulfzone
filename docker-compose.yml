version: '3'
services:
  web:
    build: .
    ports:
      - "80:3000" 
    volumes:
      # Persist JSON data (content.json, services.json)
      - ./data:/usr/src/app/data  
      # Persist Uploaded Images - Adjusted to match the PUBLIC_DIR in server.js
      - ./public/assets/images/uploads:/usr/src/app/public/assets/images/uploads 
    
    # Load all variables (PORT, ADMIN_PASSWORD, EMAIL_PASS, etc.) from .env
    env_file:
      - .env
      
    # Use 'always' to ensure the site stays online after a VPS reboot or crash
    restart: always