<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Services - Gulf Zone</title>
    <link rel="icon" type="image/x-icon" href="assets/images/common/favicon.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/services.css"> <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="header-placeholder"></div>

    <main id="main-services-page">
        <section class="srv-hero">
            <div class="srv-hero-overlay"></div>
            <div class="srv-hero-content">
                <h1 class="srv-main-title">Our Services</h1>
            </div>
        </section>

        <section class="srv-intro">
            <p>We offer a comprehensive range of trading and supply services for construction, MEP, industrial, and recreational projects.</p>
        </section>

        <section class="srv-container" id="services-container">
            <div style="text-align:center; padding: 50px;">
                <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                <p>Loading Services...</p>
            </div>
        </section>

    </main>

    <div id="common-footer"></div>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/common.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('services-container');
            if (!container) return;

            // 1. Fetch Data from API
            fetch('/api/services') 
                .then(response => response.json())
                .then(data => {
                    const services = data.servicesPage || [];
                    
                    if(services.length === 0) {
                        container.innerHTML = '<p class="text-center">No services found.</p>';
                        return;
                    }

                    // 2. Generate HTML using CORRECT CSS Classes
                    let content = '';
                    services.forEach((service, index) => {
                        // Alternate background colors defined in CSS
                        const bgClass = (index % 2 === 0) ? 'srv-bg-pink' : 'srv-bg-purple';

                        content += `
                            <div class="srv-card ${bgClass}">
                                <div class="srv-text-content">
                                    <h3>${service.title}</h3>
                                    <p>${service.description}</p>
                                </div>
                                <div class="srv-img-wrapper">
                                    <img src="${service.image}" alt="${service.title}">
                                </div>
                            </div>
                        `;
                    });
                    
                    container.innerHTML = content;

                    // 3. Initialize Animation (GSAP)
                    // We must call this AFTER the HTML is added to the page
                    initServiceAnimations();
                })
                .catch(error => {
                    console.error('Error loading services:', error);
                    container.innerHTML = '<p style="text-align:center; color:red;">Failed to load services.</p>';
                });
        });

        // GSAP Animation Function
        function initServiceAnimations() {
            gsap.registerPlugin(ScrollTrigger);
            
            // Animate each card
            const cards = document.querySelectorAll('.srv-card');
            cards.forEach((card, i) => {
                gsap.fromTo(card, 
                    { 
                        opacity: 0, 
                        y: 50 // Start slightly lower
                    },
                    {
                        scrollTrigger: {
                            trigger: card,
                            start: "top 85%", // Start animation when card is near bottom of screen
                            toggleActions: "play none none reverse"
                        },
                        opacity: 1, // Fade in
                        y: 0,       // Move up to original position
                        duration: 0.8,
                        ease: "power2.out"
                    }
                );
            });
        }
    </script>
    <script src="assets/js/dynamic-content.js"></script>
</body>
</html>
